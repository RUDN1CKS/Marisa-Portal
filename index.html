<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRAGGO</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginPage" class="login">
  <div class="box">
    <h2>Login</h2>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;">
  <div class="phone">

    <!-- TOP BAR -->
    <div class="topbar">
      <div>💬 FRAGGO</div>
      <div>
        <button onclick="pickColor()">🎨</button>
        <button onclick="refresh()">🔄</button>
        <button onclick="logout()">⎋</button>
      </div>
    </div>

    <!-- CHAT -->
    <div id="messagesPage" class="page">
      <div id="messages" class="chat"></div>

      <div class="input">
        <input id="messageInput" placeholder="Message...">
        <button onclick="sendMessage()">➤</button>
      </div>
    </div>

    <!-- NOTES -->
    <div id="listPage" class="page hidden">
      <div class="notes">
        <h3>Notes</h3>
        <input id="todoInput" placeholder="Add note...">
        <button onclick="addTask()">Add</button>
        <ul id="todoList"></ul>
      </div>
    </div>

    <!-- GAME -->
    <div id="gamesPage" class="page hidden">
      <div class="gameWrap">
        <h3>Tic Tac Toe</h3>
        <div class="grid" id="board"></div>
        <button onclick="resetGame()">Reset</button>
      </div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button onclick="showTab('messages')">💬</button>
      <button onclick="showTab('list')">📝</button>
      <button onclick="showTab('games')">🎮</button>
    </div>

  </div>
</div>

<!-- JS FILE -->
<script type="module" src="app.js"></script>

</body>
</html>
