<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRAGGO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="login">
  <div class="box">
    <h2>FRAGGO</h2>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="signup()">Create</button>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;">
  <div class="phone">

    <!-- TOP -->
    <div class="topbar">
      <div>💬 FRAGGO</div>
      <div>
        <button onclick="pickColor()">🎨</button>
        <button onclick="refresh()">🔄</button>
        <button onclick="logout()">⎋</button>
      </div>
    </div>

    <!-- PAGES -->
    <div id="messagesPage" class="page">
      <div id="messages" class="chat"></div>

      <div class="input">
        <input id="messageInput" placeholder="Message...">
        <button onclick="sendMessage()">➤</button>
      </div>
    </div>

    <div id="listPage" class="page hidden">
      <h3>Tasks</h3>
      <input id="todoInput" placeholder="New task...">
      <button onclick="addTask()">Add</button>
      <ul id="todoList"></ul>
    </div>

    <div id="gamesPage" class="page hidden">
      <h3>Tic Tac Toe</h3>
      <div class="grid">
        <button onclick="move(this)"></button><button onclick="move(this)"></button><button onclick="move(this)"></button>
        <button onclick="move(this)"></button><button onclick="move(this)"></button><button onclick="move(this)"></button>
        <button onclick="move(this)"></button><button onclick="move(this)"></button><button onclick="move(this)"></button>
      </div>
    </div>

    <!-- BOTTOM TABS -->
    <div class="tabs">
      <button onclick="showTab('messages')">💬</button>
      <button onclick="showTab('list')">📝</button>
      <button onclick="showTab('games')">🎮</button>
    </div>

  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
