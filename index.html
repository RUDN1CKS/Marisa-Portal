<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marisa Portal ❤️</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body{
background:#0f0f10;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}
.phone{
width:390px;
height:844px;
background:#16181d;
border-radius:35px;
overflow:hidden;
box-shadow:0 0 40px rgba(255,105,180,.15);
display:flex;
flex-direction:column;
}
.header{
padding:18px;
display:flex;
align-items:center;
background:#1d2026;
border-bottom:1px solid #2d3138;
}
.avatar{
width:50px;
height:50px;
border-radius:50%;
background:linear-gradient(45deg,#ff4d6d,#ff8fa3);
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
margin-right:12px;
}
.header-info h2{
font-size:18px;
}
.header-info p{
font-size:12px;
color:#8aff80;
}
.malana{
margin-left:auto;
background:#3a86ff;
border:none;
padding:10px 14px;
border-radius:15px;
color:white;
}
.page{
flex:1;
overflow-y:auto;
padding:20px;
}
.message{
padding:12px 16px;
border-radius:20px;
margin-bottom:10px;
max-width:75%;
}
.received{
background:#262a31;
width:fit-content;
}
.sent{
background:linear-gradient(45deg,#3a86ff,#6aa7ff);
margin-left:auto;
width:fit-content;
}
.input-area{
padding:15px;
display:flex;
gap:10px;
background:#1d2026;
}
.input-area input{
flex:1;
background:#2a2f36;
border:none;
padding:14px;
border-radius:25px;
color:white;
}
.input-area button{
background:#3a86ff;
border:none;
width:50px;
border-radius:50%;
color:white;
font-size:18px;
}
.bottom{
height:70px;
background:#1d2026;
display:flex;
justify-content:space-around;
align-items:center;
border-top:1px solid #2d3138;
}
.bottom button{
background:none;
border:none;
font-size:24px;
color:white;
}
.hidden{
display:none;
}
.todo-input{
width:100%;
padding:12px;
border:none;
border-radius:15px;
margin-top:10px;
}
.todo-btn{
margin-top:10px;
padding:10px 15px;
border:none;
border-radius:10px;
background:#3a86ff;
color:white;
}
li{
margin-top:10px;
}
</style>
</head>
<body>
<div class="phone">
<div class="header">
<div class="avatar">❤️</div>
<div class="header-info">
<h2>Marisa</h2>
<p>Online Now</p>
</div>

🤖

</div>
<div id="chatPage" class="page">
<div id="messages">
<div class="message received">
Hey babe ❤️
</div>
<div class="message sent">
Building our app 😎
</div>
</div>
</div>
<div id="todoPage" class="page hidden">
<h2>📝 Shared To-Do</h2>
<input id="todoInput" class="todo-input" placeholder="Add task...">
<button class="todo-btn" onclick="addTask()">
Add Task
</button>
<ul id="todoList"></ul>
</div>
<div id="malanaPage" class="page hidden">
<h2>🤖 Malana</h2>
<br>
<p>Hello ❤️ I'm Malana.</p>
<br>
<p>Eventually I'll help with planning, reminders, date ideas, and more.</p>
</div>
<div id="gamesPage" class="page hidden">
<h2>🎮 Games</h2>
<br>
<p>Tic Tac Toe coming soon.</p>
</div>
<div class="input-area">
<input id="messageInput" placeholder="Message Marisa...">
<button onclick="sendMessage()">➤</button>
</div>
<div class="bottom">
<button onclick="showPage('chat')">💬</button>
<button onclick="showPage('todo')">📝</button>
<button onclick="showPage('malana')">🤖</button>
<button onclick="showPage('games')">🎮</button>
</div>
</div>
<script>
function showPage(page){
document.getElementById('chatPage').classList.add('hidden');
document.getElementById('todoPage').classList.add('hidden');
document.getElementById('malanaPage').classList.add('hidden');
document.getElementById('gamesPage').classList.add('hidden');
document.getElementById(page + 'Page').classList.remove('hidden');
}
function sendMessage(){
const input = document.getElementById('messageInput');
const text = input.value.trim();
if(text === '') return;
const bubble = document.createElement('div');
bubble.className = 'message sent';
bubble.textContent = text;
document.getElementById('messages').appendChild(bubble);
input.value = '';
}
function addTask(){
const input = document.getElementById('todoInput');
if(input.value.trim() === '') return;
const li = document.createElement('li');
li.textContent = input.value;
document.getElementById('todoList').appendChild(li);
input.value = '';
}
</script>
</body>
</ht
